[project]
name = "video-stabilizer"
version = "0.1.0"
description = "参照映像のルック（輝度・コントラスト・彩度）をターゲット動画に転写するツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=17.0.1",
    "PySide6>=6.7",
    "numexpr>=2.14.1",
    "opencv-python>=4.13.0.92",
    "numpy>=1.26.0",
    "tqdm>=4.67.3",
]

[project.scripts]
video-stabilizer = "video_stabilizer.app:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_stabilizer"]
