name: CI Pipeline

on:
  push:
    tags:
      - "v*"
      - "build_test"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e .

      - name: compileall
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import video_stabilizer.app"

  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Import smoke test
        run: python -c "import video_stabilizer.app"

      - name: Set PyInstaller output name
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $stem = "SBC_VideoStabilizer_$tag"
          } elseif ($env:GITHUB_REF -eq 'refs/tags/build_test') {
            $stem = "SBC_VideoStabilizer_build_test_b$($env:GITHUB_RUN_NUMBER)"
          } else {
            $ver = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
            $stem = "SBC_VideoStabilizer_v${ver}_b$($env:GITHUB_RUN_NUMBER)"
          }
          "PYINSTALLER_NAME=$stem" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: PyInstaller (onefile, console)
        shell: pwsh
        run: |
          pyinstaller --onefile `
            --name $env:PYINSTALLER_NAME `
            --collect-binaries av `
            --collect-binaries cv2 `
            --collect-submodules numexpr `
            --hidden-import tkinter `
            --hidden-import tkinter.filedialog `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBC_VideoStabilizer-windows
          path: dist/${{ env.PYINSTALLER_NAME }}.exe

      - name: Write release notes (SHA256)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Join-Path dist "$env:PYINSTALLER_NAME.exe"
          $h = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          $lines = @(
            "SHA256: $h",
            "",
            "Logging: set environment variable VS_LOG_LEVEL (e.g. DEBUG, INFO)."
          )
          $lines -join "`n" | Set-Content -Encoding utf8 release_notes.md

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PYINSTALLER_NAME }}.exe
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
